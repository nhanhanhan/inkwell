# .github/workflows/build-check.yml
#
# First focused workflow: confirm the server Docker image still builds when a
# pull request targets main or a change reaches main.

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Build the server Docker image
        run: docker build -t inkwell-server:ci ./server

      - name: Verify the image exists
        run: docker image inspect inkwell-server:ci --format 'Built {{.Id}} ({{.Architecture}}, {{.Size}} bytes)'

      - name: Confirm the image was built
        run: docker images inkwell-server:ci
